# llm.ornith.model.theorems.dev の公開 (llama-server の --api-key-file の鍵で守る)。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-ornith-model
  namespace: ai-model
spec:
  parentRefs: [{name: cluster-gateway, namespace: rtf}]
  hostnames: [llm.ornith.model.theorems.dev]
  rules:
  - backendRefs: [{name: llm-ornith-model, port: 80}]
    # 長い生成のため。今の共有 Gateway (cloud-provider-kind) は timeouts を無視して 15 秒で切る (k0/README.md)
    timeouts: {request: 900s, backendRequest: 900s}
