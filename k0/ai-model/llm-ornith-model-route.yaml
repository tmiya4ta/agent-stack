# llm.ornith.model.theorems.dev の公開。GPU の渡し方 (特権をやめる方法) が決まるまで適用しない。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-ornith-model
  namespace: ai-model
spec:
  parentRefs: [{name: cluster-gateway, namespace: rtf}]
  hostnames: [llm.ornith.model.theorems.dev]
  rules:
  - backendRefs: [{name: llm-ornith-model, port: 80}]
