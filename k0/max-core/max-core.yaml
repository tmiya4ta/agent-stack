# max-core (マックス証券の System API と、調査エージェントの MCP)。プログラムは max/core (mulay build)。
#   8081: 業務の API (中だけ。ClusterIP)。8082: MCP (mcp-surveillance.max.theorems.dev、経路に鍵 /k/<鍵>/mcp)
# 秘密: Secret max-core-secrets (secrets.sh)。keys.properties (api.key と db.password) と sf.yaml (承認箱の Salesforce)
# DB: max-pg (同じ名前空間、DB max、利用者 max_app)。スキーマと合成データは max/db (README の手順で流す)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: max-core
  namespace: max-core
  labels: {app: max-core}
spec:
  replicas: 1
  selector:
    matchLabels: {app: max-core}
  template:
    metadata:
      labels: {app: max-core}
    spec:
      containers:
      - name: max-core
        image: max-core:0.2.1
        imagePullPolicy: IfNotPresent
        args:
        - http.port=8081
        - mcp.port=8082
        - keys.file=/secrets/max-core/keys.properties
        - sf.file=/secrets/max-core/sf.yaml
        - mq.file=/secrets/max-core/mq.yaml
        # 注文 (同じ名前空間の max-oms)。約定は Anypoint MQ のキュー max-fills で届く
        - oms.url=http://max-oms.max-core.svc.cluster.local
        - db.url=jdbc:postgresql://max-pg.max-core.svc.cluster.local:5432/max
        - db.user=max_app
        # 調査エージェント (T1/Sandbox の Agent Network。sets/max-demo)
        - broker.url=https://ft1-23fgzd.pnwfdv.jpn-e1.cloudhub.io/max-surveillance-broker/
        ports:
        - {name: http, containerPort: 8081}
        - {name: mcp, containerPort: 8082}
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, runAsNonRoot: true, readOnlyRootFilesystem: true}
        readinessProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 10
        volumeMounts:
        - {name: secrets, mountPath: /secrets/max-core, readOnly: true}
      volumes:
      - name: secrets
        secret: {secretName: max-core-secrets}
---
apiVersion: v1
kind: Service
metadata:
  name: max-core
  namespace: max-core
spec:
  selector: {app: max-core}
  ports:
  - {name: http, port: 80, targetPort: http}
  - {name: mcp, port: 8082, targetPort: mcp}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-surveillance
  namespace: max-core
spec:
  parentRefs: [{name: cluster-gateway, namespace: rtf}]
  hostnames: [mcp-surveillance.max.theorems.dev]
  rules:
  # MCP だけを外に出す (業務の API は出さない)
  - matches: [{path: {type: PathPrefix, value: /k/}}]
    backendRefs: [{name: max-core, port: 8082}]
    timeouts: {request: 900s, backendRequest: 900s}
