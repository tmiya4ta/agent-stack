# max-core の設定。k0 では key=value (mulay の引数) か -D で上書きする。
http:
  port: "8081"
# 業務の DB (PostgreSQL)。試験は mulay の試験用の PG (localhost:15432、スキーマ max)。k0 では max-pg
db:
  url: "jdbc:postgresql://localhost:15432/mulay"
  user: "mulay"
  # password は keys.file の方 (k8s では Secret)
# POST /admin/reset (スキーマと合成データの流し直し) を受けるか。試験のときだけ true にする
admin:
  reset: "false"
# 承認の ID の前置き (AP-0001..)。試験は別の前置きにして、承認箱の本物の依頼と混ぜない
approval:
  prefix: "AP"
# 承認箱 (Salesforce) を見る間隔 (ミリ秒) と、見るかどうか (started / stopped)
sync:
  interval: "30000"
  state: "started"
# MCP の口 (調査エージェントの道具)。外に出すのはこちらだけ
mcp:
  port: "8082"
