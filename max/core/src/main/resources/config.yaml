# max-core の設定。k0 では key=value (mulay の引数) か -D で上書きする。
http:
  port: "8081"
# 業務の DB (PostgreSQL)。試験は mulay の試験用の PG (localhost:15432、スキーマ max)。k0 では max-pg
db:
  url: "jdbc:postgresql://localhost:15432/mulay"
  user: "mulay"
  # password は keys.file の方 (k8s では Secret)
# POST /admin/reset (スキーマと合成データの流し直し) を受けるか。試験のときだけ true にする
admin:
  reset: "false"
# 承認の ID の前置き (AP-0001..)。試験は別の前置きにして、承認箱の本物の依頼と混ぜない
approval:
  prefix: "AP"
# 承認箱 (Salesforce) を見る間隔 (ミリ秒) と、見るかどうか (started / stopped)
sync:
  interval: "30000"
  state: "started"
# MCP の口 (調査エージェントの道具)。外に出すのはこちらだけ
mcp:
  port: "8082"
# アラートができたら調査エージェント (Agent Network の broker、A2A 1.0) に調べさせる。url が空なら呼ばない。
# JWT の鍵 (broker.jwtSecret) は keys.file の方。async=false は試験用 (順に呼ぶ)
broker:
  url: ""
  # 口座開設の broker (空なら回さない)
  opsUrl: ""
dispatch:
  async: "true"
# 注文 (v2): OMS (max-oms) の URL と鍵 (oms.key は keys.file)。試験では偽の OMS (http://localhost:<port>/admin/fake-oms)
oms:
  url: ""
# 約定のキュー (Anypoint MQ)。取り込みの間隔 (ミリ秒)、受けるときの待ち (ミリ秒)、空の待ちが何回続いたらやめるか
mq:
  fillsQueue: "max-fills"
fills:
  interval: "60000"
  state: "started"
  pollingTime: "2000"
  maxEmpty: "10"
  # 受けた約定のロック (ミリ秒)。待ち切れずに終わった前の受け取りが後の約定を取ってロックすることがあるので短くし、すぐ戻るようにする
  lockTtl: "5000"
# 時計を自動で進める間隔 (ミリ秒) と、scheduler を動かすか。進めるかどうか自体は POST /clock/auto (DB) で切り替える
clock:
  auto:
    interval: "300000"
    state: "started"
