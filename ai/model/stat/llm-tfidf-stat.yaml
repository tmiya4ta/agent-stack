# llm.tfidf.stat.theorems.dev: 統計的な LLM (Chat Completions。agent-harness の stat::agent)。プログラムは mulay の templates/stat-models (stat.serve=llm)。
# 鍵: Secret llm-tfidf-stat-api-key (../secrets.sh ai-stat llm-tfidf-stat)。api-key.properties を keys.file で読む (無ければ起動しない)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-tfidf-stat
  namespace: ai-stat
  labels: {app: llm-tfidf-stat}
spec:
  replicas: 1
  selector:
    matchLabels: {app: llm-tfidf-stat}
  template:
    metadata:
      labels: {app: llm-tfidf-stat}
    spec:
      containers:
      - name: llm-tfidf-stat
        image: stat-models:0.1.0
        imagePullPolicy: IfNotPresent
        args: [stat.serve=llm, keys.file=/secrets/self/api-key.properties]
        ports: [{name: http, containerPort: 8080}]
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, runAsNonRoot: true, readOnlyRootFilesystem: true}
        readinessProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 10
        volumeMounts:
        - {name: self-key, mountPath: /secrets/self, readOnly: true}
      volumes:
      - name: self-key
        secret: {secretName: llm-tfidf-stat-api-key}
---
apiVersion: v1
kind: Service
metadata:
  name: llm-tfidf-stat
  namespace: ai-stat
spec:
  selector: {app: llm-tfidf-stat}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-tfidf-stat
  namespace: ai-stat
spec:
  parentRefs: [{name: cluster-gateway, namespace: rtf}]
  hostnames: [llm.tfidf.stat.theorems.dev]
  rules:
  - backendRefs: [{name: llm-tfidf-stat, port: 80}]
    # 大きな束のため。書かないと共有 Gateway が 15 秒で切る (k0/README.md)
    timeouts: {request: 900s, backendRequest: 900s}
