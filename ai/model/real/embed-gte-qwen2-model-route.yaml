# embed.gte-qwen2.model.theorems.dev の公開 (llama-server の --api-key-file の鍵で守る)。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: embed-gte-qwen2-model
  namespace: ai-model
spec:
  parentRefs: [{name: cluster-gateway, namespace: rtf}]
  hostnames: [embed.gte-qwen2.model.theorems.dev]
  rules:
  - backendRefs: [{name: embed-gte-qwen2-model, port: 80}]
    # 大きな束の埋め込みのため。書かないと共有 Gateway が 15 秒で切る (k0/README.md の「長い生成とタイムアウト」)
    timeouts: {request: 900s, backendRequest: 900s}
