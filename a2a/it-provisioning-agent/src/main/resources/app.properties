# A2A agent card URL. Must be the externally reachable URL of this app,
# because the broker fetches the card and calls back to this value.
# Keep http://localhost:8081 for local runs; set the CloudHub 2.0 / RTF
# ingress URL as a deployment property when deploying.
agent.url=http://localhost:8081

# OpenAI-compatible endpoint this mock agent calls to generate its reply.
# llm.proxy.path is the Responses API path under the base URL.
llm.proxy.host={{llm-host}}
llm.proxy.port=443
llm.proxy.protocol=HTTPS
llm.proxy.path=/openai/v1/responses

# Keep responseTimeout well above Mule's 10s default: a reasoning model
# routinely takes longer than that and the broker would see an empty reply.
llm.responseTimeout=120000
llm.connectionIdleTimeout=120000
llm.maxConnections=-1

llm.maxOutputTokens=1200
llm.reasoningEffort=low
llm.model=gpt-5-mini

# Sent as "Authorization: Bearer ${llm.apiKey}".
# For a proxy fronted by Basic authentication, use base64(clientId:clientSecret).
# Do not commit a real key - pass it as a secure deployment property instead.
llm.apiKey={{llm-api-key}}
