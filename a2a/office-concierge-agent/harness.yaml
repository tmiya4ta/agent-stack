name: office-concierge-agent
kind: a2a
runtime: mule
version: 1.7.8
build: mvn -B clean package -DskipTests
artifact: target/*-mule-application.jar
endpoint: /
deploy:
  mule:
    target: ch2
    properties:
      agent.url: ${self.url}
      llm.proxy.host: ${var:llm-host}
    secure:
      llm.apiKey: ${var:llm-api-key}
